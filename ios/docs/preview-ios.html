:root{color-scheme:light dark}
body{margin:0;background:#d9dad6;font-family:"Golos",system-ui,sans-serif;color:#222}
h1{font:600 16px/1.3 system-ui;margin:20px 24px 4px}
p.note{margin:0 24px 16px;font:13px/1.5 system-ui;color:#555;max-width:900px}
.row{display:flex;gap:24px;padding:0 24px 32px;flex-wrap:wrap}
figure{margin:0}
figcaption{font:12px system-ui;color:#555;margin:0 0 8px}
/* телефон 390×844 */
.ph{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 0 0 8px #111}
.ph.light{--surface:#F4F5F2;--ink:#2A3430;--mut:#5F6A65;--line:#DADFDA;--btn:#4F6358;--onbtn:#fff;--glass:#fff;--sage:#DCE8DF;--sand:#EFE9D6;--bar:#F4F5F2}
.ph.dark{--surface:#1C2120;--ink:#EEF2EF;--mut:#9AA6A0;--line:#333B38;--btn:#D9E1DC;--onbtn:#1C2120;--glass:#242A28;--sage:#2F4038;--sand:#3A372B;--bar:#1C2120}
.home{flex:1;display:flex;flex-direction:column;background:var(--fill,var(--surface));color:var(--fill-ink,var(--ink));padding-top:54px}
.home.on{--fill:var(--sage)}
.light.home.on,.light .home.on{--fill-ink:#24362C}
.dark .home.on{--fill-ink:#EAF3EE}
.mono{font-family:"JBMono",monospace}
.tag{display:flex;justify-content:space-between;padding:14px 20px 0;font:400 10px "JBMono";color:var(--mut)}
.on .tag{color:inherit;opacity:.78}
.code{margin:6px 0 0 12px;height:205px;overflow:hidden;font:700 230px/205px "Golos";letter-spacing:-16px;white-space:nowrap;color:transparent;-webkit-text-stroke:2px var(--line)}
.on .code{color:var(--fill-ink,var(--ink));-webkit-text-stroke:0}
.title{padding:4px 20px 0;font:600 27px/1.1 "Golos";letter-spacing:-.02em}
.sub{padding:6px 20px 0;font:400 13px/1.4 "Golos";color:var(--mut);min-height:40px}
.on .sub{color:inherit;opacity:.78}
.tbl{margin:14px 20px 0;font:400 12px "JBMono"}
.tbl .r{display:flex;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.on .tbl .r{border-color:rgba(36,54,44,.22)}
.dark.ph .on .tbl .r{border-color:rgba(234,243,238,.22)}
.tbl .k{width:96px;color:var(--mut)}
.on .tbl .k{opacity:.78;color:inherit}
.tbl .end{border-bottom:1px solid var(--line)}
.scale{position:relative;display:flex;gap:2px;width:96px;height:6px;margin-right:10px}
.scale i{flex:1;display:block}
.scale i:nth-child(1){background:#6E8B79}.scale i:nth-child(2){background:#B39A62}.scale i:nth-child(3){background:#A5655E}
.scale b{position:absolute;top:-4px;width:3px;height:14px;background:currentColor}
.sp{flex:1}
.cta{margin:0 20px 12px;height:56px;border-radius:2px;background:var(--cbtn,var(--btn));color:var(--onbtn);display:flex;align-items:center;justify-content:center;font:700 13px "JBMono";letter-spacing:.06em}
.busy .cta{--cbtn:#6B6444}
/* системный TabView iOS */
.tabs{height:83px;background:var(--bar);border-top:.5px solid var(--line);display:flex;justify-content:space-around;padding-top:8px;font:500 10px system-ui;color:var(--mut)}
.tabs div{display:flex;flex-direction:column;align-items:center;gap:3px;width:70px}
.tabs .sel{color:var(--btn)}
.dark .tabs .sel{color:#D9E1DC}
.tabs span{font-size:22px;line-height:24px}
/* серверы */
.srv{flex:1;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);padding-top:54px;overflow:hidden}
.srv .head{display:flex;justify-content:space-between;align-items:flex-end;padding:8px 16px 0}
.srv h2{margin:0;font:700 23px/1.1 "Golos"}
.srv .cnt{font:500 11px "Golos";color:var(--mut);margin-top:2px}
.srv .btns{display:flex;gap:8px}
.srv .btns div{width:44px;height:44px;border-radius:2px;background:var(--glass);display:flex;align-items:center;justify-content:center;font-size:16px}
.seg{display:flex;margin:12px 16px 8px;background:var(--glass);border-radius:2px;padding:3px}
.seg div{flex:1;text-align:center;padding:8px 0;font:600 11px "Golos";color:var(--mut);border-radius:2px}
.seg .a{background:var(--sage);color:var(--ink)}
.list{padding:0 16px}
.sr{display:flex;align-items:center;gap:12px;padding:4px 10px;border-top:1px solid var(--line);position:relative;min-height:52px}
.sr.sel{background:var(--glass)}
.sr.sel:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ink)}
.sr .c{width:74px;font:700 27px "JBMono";letter-spacing:-1.6px}
.sr .n{flex:1;font:600 14px/1.2 "Golos"}
.sr .p{display:flex;flex-direction:column;align-items:flex-end;gap:3px;width:56px;font:600 12px "JBMono"}
.sr .p .scale{width:48px;height:4px;margin:0}
.sr .p .scale b{top:-4px;height:12px;width:3px}
.sr .st{width:44px;text-align:center;color:var(--mut);font-size:16px}
</style>
</head>
